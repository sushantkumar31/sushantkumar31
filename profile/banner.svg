<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="'Fira Code', Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="55%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="textGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Window body -->
  <rect width="900" height="260" rx="16" fill="url(#bg)" filter="url(#shadow)"/>
  <rect width="900" height="260" rx="16" fill="url(#glow)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="38" rx="16" fill="#24283b"/>
  <rect x="0" y="22" width="900" height="16" fill="#24283b"/>
  <circle cx="24" cy="19" r="7" fill="#f7768e"/>
  <circle cx="47" cy="19" r="7" fill="#e0af68"/>
  <circle cx="70" cy="19" r="7" fill="#9ece6a"/>
  <text x="450" y="24" text-anchor="middle" font-size="13" fill="#565f89">sushantkumar31 — zsh — 80×24</text>

  <!-- Accent underline on the title bar -->
  <rect x="0" y="38" width="900" height="2" fill="url(#accentBar)"/>

  <!-- Prompt line 1 -->
  <text x="26" y="70" font-size="16" fill="#7aa2f7">➜ <tspan fill="#9ece6a">~/profile</tspan> <tspan fill="#bb9af7">on</tspan> <tspan fill="#e0af68">main</tspan> <tspan fill="#bb9af7">✚</tspan></text>
  <text x="26" y="94" font-size="16" fill="#c0caf5">Sushant Kumar Bellana — CS Student · AI/ML Learner</text>

  <!-- Prompt line 2 -->
  <text x="26" y="124" font-size="16" fill="#7aa2f7">➜ <tspan fill="#9ece6a">~/profile</tspan> cat motto.txt</text>
  <text x="26" y="148" font-size="16" fill="#c0caf5">"Learn loudly, <tspan fill="#9ece6a">build consistently</tspan>, share openly."</text>

  <!-- Prompt line 3 -->
  <text x="26" y="178" font-size="16" fill="#7aa2f7">➜ <tspan fill="#9ece6a">~/profile</tspan> python3 -c <tspan fill="#e0af68">"print('open to collabs')"</tspan></text>
  <text x="26" y="204" font-size="16" fill="#9ece6a">open to collabs █</text>

  <!-- Tag chips row -->
  <g font-size="12" font-family="'Fira Code', Consolas, monospace">
    <rect x="26" y="222" width="118" height="24" rx="12" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="85" y="238" text-anchor="middle" fill="#7aa2f7">Python</text>

    <rect x="152" y="222" width="112" height="24" rx="12" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="208" y="238" text-anchor="middle" fill="#9ece6a">ML · Feature Eng</text>

    <rect x="272" y="222" width="112" height="24" rx="12" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="328" y="238" text-anchor="middle" fill="#bb9af7">LLM · RAG</text>

    <rect x="392" y="222" width="104" height="24" rx="12" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="444" y="238" text-anchor="middle" fill="#f7768e">DSA</text>
  </g>

  <!-- Blinking cursor in prompt 3 -->
  <rect x="150" y="192" width="9" height="14" fill="#c0caf5" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.1;0.9" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
